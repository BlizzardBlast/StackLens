name: offsite preview backups

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Capture and verify a backup, or check freshness and expire owned artifacts
        type: choice
        options: [backup, maintain]
        default: backup
  schedule:
    - cron: "17 5,17 * * *"
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: offsite-preview-backups
  cancel-in-progress: false

# NFR-010/009, SEC-003/007. Disabled until approved unattended custody and main publication.
jobs:
  capture:
    if: >-
      github.repository == 'BlizzardBlast/StackLens' && github.ref == 'refs/heads/main' &&
      vars.STACKLENS_OFFSITE_BACKUPS_ENABLED == 'true' &&
      (github.event.schedule == '17 5,17 * * *' || inputs.operation == 'backup')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-offsite-capture
      deployment: false
    outputs:
      artifact_name: ${{ steps.operation.outputs.artifact_name }}
    steps:
      - name: Initialize source-free startup evidence
        run: >-
          printf '%s\n' '{"status":"failed","phase":"startup","mode":"capture","failureCode":"offsite_backup_startup_incomplete","startup":{"operationStarted":false}}'
          > "$RUNNER_TEMP/offsite-capture.json"
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - name: Prepare PostgreSQL image with bounded retries
        id: image
        run: node scripts/operations/offsite-backup-startup.mjs pull "$RUNNER_TEMP/offsite-image.json"
      - name: Capture consistent online snapshot
        id: operation
        env:
          STACKLENS_BACKUP_DATABASE: ${{ secrets.STACKLENS_BACKUP_DATABASE }}
          STACKLENS_BACKUP_MASTER: ${{ secrets.STACKLENS_BACKUP_MASTER }}
        run: node scripts/operations/offsite-backup.mjs capture "$RUNNER_TEMP/offsite-backup" "$RUNNER_TEMP/offsite-capture.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.operation.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/offsite-backup/database.slbackup
            ${{ runner.temp }}/offsite-backup/online.slmetadata
          # Restore eligibility remains 24 hours; leave a day for authenticated hourly deletion.
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Finalize source-free startup evidence
        if: always() && steps.checkout.outcome == 'success'
        env:
          OFFSITE_STARTUP_STEPS: ${{ toJSON(steps) }}
        run: >-
          node scripts/operations/offsite-backup-startup.mjs finalize
          "$RUNNER_TEMP/offsite-capture.json" "$RUNNER_TEMP/offsite-image.json" capture
      - name: Upload source-free capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offsite-capture-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/offsite-capture.json
          retention-days: 1
          if-no-files-found: error

  verify:
    name: verify offsite backup
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview-offsite-readback
      deployment: false
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stacklens_test
          POSTGRES_PASSWORD: stacklens
          POSTGRES_USER: stacklens
        options: >-
          --health-cmd "pg_isready -U stacklens -d stacklens_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: [55432:5432]
    env:
      TEST_DATABASE_URL: postgresql://stacklens:stacklens@127.0.0.1:55432/stacklens_test
    steps:
      - name: Initialize source-free startup evidence
        run: >-
          printf '%s\n' '{"status":"failed","phase":"startup","mode":"verify","failureCode":"offsite_backup_startup_incomplete","startup":{"operationStarted":false}}'
          > "$RUNNER_TEMP/offsite-verify.json"
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - name: Prepare PostgreSQL image with bounded retries
        id: image
        run: node scripts/operations/offsite-backup-startup.mjs pull "$RUNNER_TEMP/offsite-image.json"
      - id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.capture.outputs.artifact_name }}
          path: ${{ runner.temp }}/offsite-backup
      - name: Authenticate and verify on isolated PostgreSQL
        id: operation
        env:
          STACKLENS_BACKUP_MASTER: ${{ secrets.STACKLENS_BACKUP_MASTER }}
        run: node scripts/operations/offsite-backup.mjs verify "$RUNNER_TEMP/offsite-backup" "$RUNNER_TEMP/offsite-verify.json"
      - name: Finalize source-free startup evidence
        if: always() && steps.checkout.outcome == 'success'
        env:
          OFFSITE_STARTUP_STEPS: ${{ toJSON(steps) }}
        run: >-
          node scripts/operations/offsite-backup-startup.mjs finalize
          "$RUNNER_TEMP/offsite-verify.json" "$RUNNER_TEMP/offsite-image.json" verify
      - name: Upload source-free verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offsite-verify-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/offsite-verify.json
          retention-days: 1
          if-no-files-found: error

  maintain:
    needs: [capture, verify]
    if: >-
      always() && github.repository == 'BlizzardBlast/StackLens' &&
      github.ref == 'refs/heads/main' && vars.STACKLENS_OFFSITE_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: preview-offsite-readback
      deployment: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
      - name: Expire authenticated artifacts and check verified backup freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STACKLENS_BACKUP_MASTER: ${{ secrets.STACKLENS_BACKUP_MASTER }}
        run: node scripts/operations/offsite-backup-maintenance.mjs "$RUNNER_TEMP/offsite-maintenance.json"
      - name: Upload source-free maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: offsite-maintenance-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/offsite-maintenance.json
          retention-days: 1
          if-no-files-found: error

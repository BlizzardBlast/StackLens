name: quality

on:
  pull_request:
  push:
    branches:
      - main

# BOOTSTRAP ONLY: this is temporarily write-enabled so the selected formatter
# can normalize the initial scaffold and commit the first pnpm lockfile.
# Restore read-only permissions and frozen installs after the bootstrap commit.
permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build generated packages
        run: pnpm build

      - name: Normalize implementation formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Commit bootstrap lockfile and formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             package.json             pnpm-lock.yaml             pnpm-workspace.yaml             turbo.json             tsconfig.base.json             .oxlintrc.json             .oxfmtrc.json             .gitignore             packages
          if git diff --cached --quiet; then
            echo "Bootstrap files already normalized."
          else
            git commit -m "chore: apply formatter and bootstrap lockfile [NFR-002]"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify journey documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA"...HEAD | grep -Fxq "docs/design/journey.md"; then
            echo "::error::Every pull request must update docs/design/journey.md (GOV-007)."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generated packages
        run: pnpm build

      - name: Validate shadcn project
        run: pnpm ui:info > /dev/null

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Capture formatter diff
        run: |
          pnpm exec oxfmt .
          git diff -- packages/data-sources/test/osv.test.ts packages/rules-javascript/package.json packages/rules-javascript/src/index.ts packages/rules-javascript/src/scoring-coverage.ts packages/rules-javascript/test/policy-integration.test.ts packages/rules-javascript/test/policy.test.ts packages/scoring/test/stack-health-scorer.test.ts

      - name: Format check
        run: pnpm format:check

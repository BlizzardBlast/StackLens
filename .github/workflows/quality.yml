name: quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary write permission only to refresh the audited lockfile and canonical
# formatting. Restore read-only mode immediately after this bootstrap run.
permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Verify journey documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA"...HEAD | grep -Fxq "docs/design/journey.md"; then
            echo "::error::Every pull request must update docs/design/journey.md (GOV-007)."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build generated packages
        run: pnpm build

      - name: Apply canonical formatting
        run: pnpm format

      - name: Validate shadcn project
        run: pnpm ui:info > /dev/null

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Commit refreshed lockfile and formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Lockfile and formatting are already current."
          else
            git commit -m "chore: refresh hardened tooling lockfile [NFR-002]"
            git push origin HEAD:${{ github.head_ref }}
          fi

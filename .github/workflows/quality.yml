name: quality

on:
  pull_request:
  push:
    branches:
      - main

# TEMPORARY BOOTSTRAP: refresh the lockfile and canonical formatting after
# the configuration audit. This is reverted to read-only/frozen mode once
# the generated lockfile commit succeeds.
permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build generated packages
        run: pnpm build

      - name: Apply canonical formatting
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Commit refreshed lockfile and formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Lockfile and source formatting are already current."
          else
            git commit -m "chore: refresh audited tooling lockfile [NFR-002]"
            git push origin HEAD:${{ github.head_ref }}
          fi

name: web-lockfile

on:
  push:
    branches:
      - feat/repository-analysis-web-flow
    paths:
      - apps/web/package.json
      - .github/workflows/web-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Update lockfile and format web sources
        run: |
          pnpm install --lockfile-only
          pnpm format

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/web
          git commit -m "chore: update web lockfile and formatting"
          git push

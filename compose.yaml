services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: stacklens
      POSTGRES_PASSWORD: stacklens
      POSTGRES_USER: stacklens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacklens -d stacklens"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stacklens-postgres:/var/lib/postgresql

volumes:
  stacklens-postgres:

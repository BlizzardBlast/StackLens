x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *bounded-logging
    image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: stacklens
      POSTGRES_USER: stacklens
      POSTGRES_PASSWORD: ${STACKLENS_POSTGRES_PASSWORD:?Set a unique database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stacklens -d stacklens"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    logging: *bounded-logging
    image: stacklens-api:${STACKLENS_IMAGE_TAG:?Set the reviewed image revision}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: ${STACKLENS_DATABASE_URL:?Set an encoded PostgreSQL connection URL}
      STACKLENS_API_HOST: 0.0.0.0
      STACKLENS_API_PORT: "3000"
      STACKLENS_RETENTION_HOURS: ${STACKLENS_RETENTION_HOURS:-24}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "container-health.mjs", "api"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 90s
    mem_limit: ${STACKLENS_API_MEMORY_LIMIT:-512m}
    cpus: 1.0
    restart: unless-stopped

  worker:
    logging: *bounded-logging
    image: stacklens-worker:${STACKLENS_IMAGE_TAG:?Set the reviewed image revision}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: ${STACKLENS_DATABASE_URL:?Set an encoded PostgreSQL connection URL}
      STACKLENS_WORKER_CONCURRENCY: ${STACKLENS_WORKER_CONCURRENCY:-2}
      STACKLENS_GITHUB_TOKEN: ${STACKLENS_GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "container-health.mjs", "worker"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    init: true
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 90s
    mem_limit: ${STACKLENS_WORKER_MEMORY_LIMIT:-1g}
    cpus: 1.0
    restart: unless-stopped

  gateway:
    logging: *bounded-logging
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    profiles: ["https"]
    environment:
      STACKLENS_API_DOMAIN: ${STACKLENS_API_DOMAIN:?Set the public API hostname}
    depends_on:
      api:
        condition: service_healthy
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
